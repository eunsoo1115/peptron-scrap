<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peptron Scrap Master</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ink:#1a1d21; --ink2:#3d444c; --muted:#6b7280; --soft:#9aa1a9;
    --line:#dfe3e8; --line2:#eceef1; --bg:#fff; --head:#f4f6f8; --zebra:#fafbfc;
    --sel:#eef4ff; --selln:#2563eb;
    --core:#0d7d6e; --core-bg:#e6f5f2;
    --obesity:#2256c4; --obesity-bg:#e9f0fd;
    --npr:#6d28d9; --npr-bg:#f1ecfd;
    --platform:#b03052; --platform-bg:#fbeaef;
    --reg:#b5730a; --reg-bg:#fcf2e0;
    --mkt:#4a5563; --mkt-bg:#eef0f2;
  }
  html,body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  .topbar{height:46px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:60;}
  .logo{display:flex;align-items:baseline;gap:7px;font-weight:800;font-size:15px;letter-spacing:-0.02em;}
  .logo .mk{font-family:Georgia,serif;font-style:italic;color:#5fe3cd;font-size:17px;}
  .logo .tl{font-size:11px;color:#9aa6ad;font-weight:500;}
  .topbar .sp{flex:1;}
  .search{display:flex;align-items:center;gap:6px;background:#262c32;border:1px solid #363d44;border-radius:7px;padding:5px 10px;width:260px;}
  .search input{background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:12.5px;width:100%;}
  .search input::placeholder{color:#717b83;}
  .topbar .upd{font-size:11px;color:#9aa6ad;white-space:nowrap;}
  .topbar .upd b{color:#5fe3cd;}

  .shell{display:grid;grid-template-columns:188px 1fr;height:calc(100vh - 46px);}
  .rail{border-right:1px solid var(--line);background:var(--head);overflow-y:auto;padding:10px 8px;}
  .rail-h{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--soft);text-transform:uppercase;padding:4px 8px 8px;}
  .drow{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border-radius:6px;cursor:pointer;margin-bottom:1px;}
  .drow:hover{background:#e9edf1;}
  .drow.on{background:#fff;box-shadow:inset 2px 0 0 var(--selln);}
  .drow .dl{font-size:12.5px;font-weight:600;color:var(--ink2);}
  .drow.on .dl{color:var(--ink);}
  .drow .dd{font-size:10px;color:var(--soft);margin-left:5px;font-weight:500;}
  .drow .dc{font-size:10.5px;font-weight:700;color:var(--muted);background:#e3e7ec;border-radius:10px;padding:1px 7px;}
  .drow.on .dc{background:var(--sel);color:var(--selln);}

  /* 날짜 점프 + 아카이브 */
  .jump{display:flex;align-items:center;gap:4px;padding:2px 6px 10px;}
  .jump input[type=date]{flex:1;min-width:0;font-family:inherit;font-size:11.5px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink2);}
  .jump button{width:26px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted);font-size:12px;font-family:inherit;flex-shrink:0;}
  .jump button:hover{background:#eef1f4;color:var(--ink);}
  .mgroup{margin-bottom:2px;}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;cursor:pointer;border-radius:6px;}
  .mhead:hover{background:#e9edf1;}
  .mhead .ml{font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;}
  .mhead .chev{font-size:9px;color:var(--soft);transition:transform .12s;}
  .mhead.closed .chev{transform:rotate(-90deg);}
  .mhead .mc{font-size:10px;font-weight:700;color:var(--soft);}
  .mbody{padding-left:2px;}

  .main{display:flex;flex-direction:column;overflow:hidden;}
  .dayhead{display:flex;align-items:baseline;gap:10px;padding:11px 18px 9px;}
  .dayhead h1{font-size:17px;font-weight:800;letter-spacing:-0.02em;}
  .dayhead .dw{font-size:12px;color:var(--muted);font-weight:600;}
  .dayhead .gi{margin-left:auto;font-size:11px;color:var(--soft);}
  .dayhead .gi b{color:var(--muted);}

  /* layer tabs (뉴스/논문/임상) — 큰 구분 */
  .layers{display:flex;gap:4px;padding:0 16px;background:var(--head);border-bottom:1px solid var(--line);}
  .ltab{display:flex;align-items:center;gap:7px;padding:9px 18px;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:none;border-bottom:2.5px solid transparent;cursor:pointer;font-family:inherit;}
  .ltab:hover{color:var(--ink2);}
  .ltab.on{color:var(--ink);border-bottom-color:var(--ink);}
  .ltab .lc{font-size:11px;font-weight:700;color:var(--soft);background:#e3e7ec;border-radius:10px;padding:1px 8px;}
  .ltab.on .lc{background:var(--ink);color:#fff;}
  .ltab .ico{font-size:14px;}

  /* category sub-tabs */
  .tabs{display:flex;gap:2px;padding:9px 14px 0;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--line);}
  .tab{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--head);border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;font-family:inherit;}
  .tab:hover{color:var(--ink2);background:#eef1f4;}
  .tab.on{color:var(--ink);background:#fff;font-weight:700;}
  .tab .dot{width:7px;height:7px;border-radius:50%;}
  .tab .cnt{font-size:10px;font-weight:700;color:var(--soft);background:#e9edf1;border-radius:9px;padding:0 6px;min-width:16px;text-align:center;}
  .dot.core{background:var(--core);} .dot.obesity{background:var(--obesity);} .dot.npr{background:var(--npr);}
  .dot.platform{background:var(--platform);} .dot.reg{background:var(--reg);} .dot.mkt{background:var(--mkt);} .dot.all{background:var(--ink2);}
  .tab.on .cnt{color:#fff;background:var(--ink2);}

  .tablewrap{flex:1;overflow:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{position:sticky;top:0;background:var(--head);z-index:5;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;padding:7px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
  th.c-meta{width:62px;} th.c-src{width:138px;} th.c-cat{width:118px;}
  tbody tr{border-bottom:1px solid var(--line2);cursor:pointer;}
  tbody tr:nth-child(even){background:var(--zebra);}
  tbody tr:hover{background:var(--sel);}
  td{padding:7px 12px;vertical-align:top;}
  td.c-meta{color:var(--soft);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:8px;}
  td.c-src{font-size:11.5px;white-space:nowrap;}
  td.c-src .pub{font-weight:600;color:var(--ink2);display:block;line-height:1.3;}
  td.c-src .sb{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;display:inline-block;margin-top:2px;}
  .sb.naver{background:#e7f5ea;color:#138a3e;} .sb.gnews{background:#eaeef4;color:#41566f;}
  .sb.rss{background:#f1ecfd;color:#6d28d9;} .sb.dart{background:#fcf2e0;color:#9a6207;}
  .stbadge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:#e9edf1;color:#41566f;display:inline-block;}
  .stbadge.live{background:#e7f5ea;color:#138a3e;}
  td.c-cat{white-space:nowrap;}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:5px;}
  .chip .cd{width:6px;height:6px;border-radius:50%;}
  .chip.core{background:var(--core-bg);color:var(--core);} .chip.core .cd{background:var(--core);}
  .chip.obesity{background:var(--obesity-bg);color:var(--obesity);} .chip.obesity .cd{background:var(--obesity);}
  .chip.npr{background:var(--npr-bg);color:var(--npr);} .chip.npr .cd{background:var(--npr);}
  .chip.platform{background:var(--platform-bg);color:var(--platform);} .chip.platform .cd{background:var(--platform);}
  .chip.reg{background:var(--reg-bg);color:var(--reg);} .chip.reg .cd{background:var(--reg);}
  .chip.mkt{background:var(--mkt-bg);color:var(--mkt);} .chip.mkt .cd{background:var(--mkt);}
  td.c-title .tt{font-weight:600;color:var(--ink);letter-spacing:-0.01em;line-height:1.4;}
  tbody tr:hover .tt{color:var(--selln);}
  td.c-title .sm{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  td.c-title .ext{font-size:10px;color:var(--soft);margin-left:5px;}

  .state{padding:64px 20px;text-align:center;color:var(--soft);}
  .state .ic{font-size:30px;opacity:.35;margin-bottom:12px;}
  .state .t{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px;}
  .state .s{font-size:12px;}

  @media(max-width:820px){
    .shell{grid-template-columns:1fr;}
    .rail{display:none;} .search{width:140px;}
    th.c-src,td.c-src{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="mk">P</span><span id="st">Peptron Scrap Master</span><span class="tl" id="ss">· RA Intelligence</span></div>
  <div class="sp"></div>
  <div class="search"><span style="color:#717b83;font-size:12px;">⌕</span><input id="q" type="text" placeholder="이 날짜에서 검색"></div>
  <div class="upd" id="upd"></div>
</div>

<div class="shell">
  <aside class="rail"><div class="rail-h">날짜</div><div id="dates"></div></aside>
  <main class="main" id="main"><div class="state"><div class="ic">◌</div><div class="t">불러오는 중…</div></div></main>
</div>

<script>
const DOW=['일','월','화','수','목','금','토'];
const LAYERS=[['news','뉴스','📰'],['paper','논문','📄'],['trial','임상','🧪']];
let MANIFEST=null, CUR_DATE=null, CUR_DATA=null, CUR_LAYER='news', CUR_TAB='all', FILTER='';
let COLLAPSED=new Set();

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dtitle(ds){const [y,m,d]=ds.split('-').map(Number);return{y,m,d,dow:DOW[new Date(y,m-1,d).getDay()]};}
function availDates(){return (MANIFEST&&MANIFEST.dates?MANIFEST.dates.map(d=>d.date):[]);}

async function boot(){
  try{ MANIFEST=await (await fetch('data/manifest.json?_='+Date.now())).json(); }catch(e){ return empty(); }
  document.getElementById('st').textContent=MANIFEST.site_title||'Scrap Master';
  document.getElementById('ss').textContent=MANIFEST.site_subtitle?'· '+MANIFEST.site_subtitle:'';
  if(MANIFEST.updated_at){const u=new Date(MANIFEST.updated_at);
    document.getElementById('upd').innerHTML='갱신 <b>'+u.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</b>';}
  // 최근 달만 펴고 나머지는 접기
  const months=[...new Set(availDates().map(d=>d.slice(0,7)))];
  months.slice(1).forEach(m=>COLLAPSED.add(m));
  renderDates();
  if(MANIFEST.dates&&MANIFEST.dates.length) loadDay(MANIFEST.dates[0].date); else empty();
}

function renderDates(){
  const box=document.getElementById('dates');
  const dates=MANIFEST.dates||[];
  if(!dates.length){box.innerHTML='';return;}
  const avail=availDates();
  const min=avail[avail.length-1], max=avail[0];

  // 날짜 점프 (달력 + 이전/다음)
  let h=`<div class="jump">
    <button title="이전(과거)" onclick="shiftDay(1)">◀</button>
    <input type="date" value="${CUR_DATE||max}" min="${min}" max="${max}" onchange="jumpDate(this.value)">
    <button title="다음(최근)" onclick="shiftDay(-1)">▶</button>
  </div>`;

  // 월별 그룹
  const groups={};
  dates.forEach(d=>{const ym=d.date.slice(0,7); (groups[ym]=groups[ym]||[]).push(d);});
  Object.keys(groups).sort().reverse().forEach(ym=>{
    const [y,m]=ym.split('-');
    const closed=COLLAPSED.has(ym);
    const sum=groups[ym].reduce((a,d)=>a+(d.total||0),0);
    h+=`<div class="mgroup"><div class="mhead${closed?' closed':''}" onclick="toggleMonth('${ym}')">
      <span class="ml"><span class="chev">▼</span>${y}년 ${Number(m)}월</span><span class="mc">${groups[ym].length}일 · ${sum}건</span></div>`;
    if(!closed){
      h+=`<div class="mbody">`;
      groups[ym].forEach(d=>{const t=dtitle(d.date),on=d.date===CUR_DATE?' on':'';
        h+=`<div class="drow${on}" onclick="loadDay('${d.date}')"><div><span class="dl">${t.m}월 ${t.d}일</span><span class="dd">${t.dow}</span></div><span class="dc">${d.total}</span></div>`;});
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  box.innerHTML=h;
}

function toggleMonth(ym){ if(COLLAPSED.has(ym))COLLAPSED.delete(ym); else COLLAPSED.add(ym); renderDates(); }

function shiftDay(delta){
  const avail=availDates(); const i=avail.indexOf(CUR_DATE);
  if(i<0)return; const j=i+delta;
  if(j>=0 && j<avail.length){ ensureOpen(avail[j]); loadDay(avail[j]); }
}
function jumpDate(v){
  const avail=availDates();
  if(avail.includes(v)){ ensureOpen(v); loadDay(v); return; }
  // 데이터 없는 날 → 가장 가까운 날짜로
  let best=null,bd=1e18; const tv=new Date(v).getTime();
  avail.forEach(d=>{const diff=Math.abs(new Date(d).getTime()-tv); if(diff<bd){bd=diff;best=d;}});
  if(best){ ensureOpen(best); loadDay(best); }
}
function ensureOpen(date){ COLLAPSED.delete(date.slice(0,7)); }
async function loadDay(date){
  CUR_DATE=date; CUR_LAYER='news'; CUR_TAB='all'; FILTER=''; document.getElementById('q').value='';
  renderDates();
  document.getElementById('main').innerHTML='<div class="state"><div class="ic">◌</div><div class="t">불러오는 중…</div></div>';
  try{ CUR_DATA=await (await fetch('data/'+date+'.json?_='+Date.now())).json(); }
  catch(e){ document.getElementById('main').innerHTML='<div class="state"><div class="ic">⚠</div><div class="t">데이터를 불러오지 못했습니다.</div></div>'; return; }
  renderDay();
}
function setLayer(l){CUR_LAYER=l;CUR_TAB='all';renderDay();}
function setTab(t){CUR_TAB=t;renderDay();}

function renderDay(){
  if(!CUR_DATA)return;
  const meta=MANIFEST.category_meta||{}, order=MANIFEST.category_order||[];
  const t=dtitle(CUR_DATA.date);
  let all=CUR_DATA.items||[];
  if(FILTER) all=all.filter(it=>(it.title+' '+it.summary+' '+it.publisher).toLowerCase().includes(FILTER));

  const layerCount={news:0,paper:0,trial:0};
  all.forEach(it=>{layerCount[it.layer||'news']=(layerCount[it.layer||'news']||0)+1;});
  const layerItems=all.filter(it=>(it.layer||'news')===CUR_LAYER);

  const gen=CUR_DATA.generated_at?new Date(CUR_DATA.generated_at).toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
  let h=`<div class="dayhead"><h1>${t.y}.${String(t.m).padStart(2,'0')}.${String(t.d).padStart(2,'0')}</h1><span class="dw">${t.dow}요일</span>
    <span class="gi">최근 수집 <b>${gen}</b> · 총 <b>${all.length}건</b>${FILTER?` · "${esc(FILTER)}"`:''}</span></div>`;

  // layer tabs
  h+=`<div class="layers">`;
  LAYERS.forEach(([id,label,ico])=>{
    h+=`<button class="ltab${CUR_LAYER===id?' on':''}" onclick="setLayer('${id}')"><span class="ico">${ico}</span>${label}<span class="lc">${layerCount[id]||0}</span></button>`;
  });
  h+=`</div>`;

  // category sub-tabs (현재 layer에 존재하는 카테고리만)
  const catCount={}; layerItems.forEach(it=>{catCount[it.category]=(catCount[it.category]||0)+1;});
  const present=order.filter(c=>catCount[c]>0);
  h+=`<div class="tabs">`;
  h+=`<button class="tab${CUR_TAB==='all'?' on':''}" onclick="setTab('all')"><span class="dot all"></span>전체<span class="cnt">${layerItems.length}</span></button>`;
  present.forEach(c=>{const m=meta[c]||{};
    h+=`<button class="tab${CUR_TAB===c?' on':''}" onclick="setTab('${c}')"><span class="dot ${c}"></span>${esc(m.tag||c)}<span class="cnt">${catCount[c]}</span></button>`;});
  h+=`</div>`;

  // table
  const rows=(CUR_TAB==='all')?layerItems:layerItems.filter(it=>it.category===CUR_TAB);
  h+=`<div class="tablewrap">`;
  if(!layerItems.length){
    const names={news:'뉴스',paper:'논문',trial:'임상'};
    h+=`<div class="state"><div class="ic">○</div><div class="t">이 날짜에 ${names[CUR_LAYER]} 항목이 없습니다.</div><div class="s">위 탭에서 다른 종류나, 왼쪽에서 다른 날짜를 선택해 보세요.</div></div>`;
  }else if(!rows.length){
    h+=`<div class="state"><div class="ic">🔍</div><div class="t">해당 분류에 항목이 없습니다.</div></div>`;
  }else{
    const cols=colHeads(CUR_LAYER);
    h+=`<table><thead><tr><th class="c-meta">${cols[0]}</th><th class="c-src">${cols[1]}</th><th class="c-cat">분류</th><th class="c-title">제목</th></tr></thead><tbody>`;
    rows.forEach(it=>{h+=row(it,meta);});
    h+=`</tbody></table>`;
  }
  h+=`</div>`;
  document.getElementById('main').innerHTML=h;
}

function colHeads(layer){
  if(layer==='paper')return['게재일','저널'];
  if(layer==='trial')return['갱신일','상태·단계'];
  return['시각','출처'];
}
function row(it,meta){
  const m=meta[it.category]||{tag:it.category};
  const chip=`<span class="chip ${it.category}"><span class="cd"></span>${esc(m.tag||it.category)}</span>`;
  let col0,col1,sm;
  if(it.layer==='paper'){
    col0=esc(it.date||'');
    col1=`<span class="pub">${esc(it.publisher||'')}</span>`;
    sm=it.summary?`<div class="sm">${esc(it.summary)}</div>`:'';
  }else if(it.layer==='trial'){
    col0=esc(it.date||'');
    const live=/모집중|모집예정|진행중/.test(it.ct_status||'')?' live':'';
    col1=`<span class="stbadge${live}">${esc(it.ct_status||'')}</span> <span style="color:var(--muted);font-size:11px;">${esc(it.ct_phase||'')}</span>`;
    sm=it.publisher?`<div class="sm">스폰서: ${esc(it.publisher)}</div>`:'';
  }else{
    col0=esc(it.time||'');
    const srcName={naver:'네이버',gnews:'구글뉴스',rss:'해외매체',dart:'DART'}[it.source]||it.source;
    col1=`<span class="pub">${esc(it.publisher||'')}</span><span class="sb ${it.source}">${srcName}</span>`;
    sm=it.summary?`<div class="sm">${esc(it.summary)}</div>`:'';
  }
  return `<tr onclick="window.open('${esc(it.url)}','_blank')">
    <td class="c-meta">${col0}</td><td class="c-src">${col1}</td><td class="c-cat">${chip}</td>
    <td class="c-title"><span class="tt">${esc(it.title)}</span><span class="ext">↗</span>${sm}</td></tr>`;
}
function empty(){
  document.getElementById('dates').innerHTML='';
  document.getElementById('main').innerHTML='<div class="state"><div class="ic">◌</div><div class="t">아직 수집된 데이터가 없습니다.</div><div class="s">GitHub Actions가 처음 실행되면 여기에 뉴스·논문·임상이 표로 나타납니다.<br>Actions 탭에서 Run workflow로 바로 채울 수 있습니다.</div></div>';
}
document.getElementById('q').addEventListener('input',e=>{FILTER=e.target.value.toLowerCase();renderDay();});
boot();
</script>
</body>
</html>
